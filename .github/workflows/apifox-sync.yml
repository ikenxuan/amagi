# 把 openapi 规范同步到 Apifox。
#
# **同步前先 `pnpm openapi` 现生成，再推那份刚生成的 openapi.json** —— 不信任仓库里
# committed 的那份。理由：2026-09-21 起 openapi.json 不再是逐字节门禁对象（见
# release.yml 与 spec.test.ts 的说明，它是数据产物、由消费处现生成），所以 committed 的那份
# 可能滞后（合并 PR 的文本合并 ≠ 重新生成、或发版只 bump 版本没重跑）。同步是它的一个消费方，
# 于是照文档站 `docs:api` 的同款做法：读之前先从注册表现生成，推出去的永远是最新的。
#
# 触发条件盯 `packages/core/src/**` 与 `packages/response-types/src/**`（端点声明 + 响应类型 ——
# 规范的两个来源）以及生成器脚本本身。不再只盯 committed 的 openapi.json：那份现在可能滞后，
# 拿它当触发信号会漏（真源变了、快照没跟上）。代价是偶尔多同步一次（改了 src 但没动规范形状），
# 但同步是幂等的覆盖导入，多推一次没有副作用 —— 比漏推安全。
#
# **为什么不用 CLI**：`apifox import` 的导入只新增、永不覆盖 —— 实测路径匹配上就
# 静默 `ignoreCount: N`。翻它的 bundle 源码能看到原因：`--format openapi` 那条分支
# 只发 `{ importFormat, data, targetBranchId }`，一个覆盖字段都不传，后端于是走
# 「只新增」默认值；而 `--format apifox` 那条硬编码了 OVERWRITE_EXISTING。
# 走开放 API 才能覆盖，详见 packages/core/scripts/sync-apifox.mjs 的注释。
#
# 需要在仓库 secrets 里配置 `APIFOX_ACCESS_TOKEN`（Apifox「账号设置 → API 访问令牌」）。
# 未配置时本 workflow 只警告并跳过，不会把 CI 弄红 —— 免得在凭据到位前挡住其他改动。

name: Apifox 同步

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/src/**'
      - 'packages/response-types/src/**'
      - 'packages/core/scripts/gen-openapi.mts'
      - 'packages/core/scripts/gen-response-schemas.mts'
      - '.github/workflows/apifox-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: 🦊 推送规范到 Apifox
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v5

      # token 缺席时早退，省掉后面装依赖 + 生成那两三分钟 —— 那时反正没有可推的目的地
      - name: 🔑 检查 token
        id: guard
        shell: bash
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$APIFOX_ACCESS_TOKEN" ]; then
            echo "::warning::仓库未配置 APIFOX_ACCESS_TOKEN，跳过同步（见 .github/workflows/apifox-sync.yml 顶部说明）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 配置 PNPM 环境
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install

      # 从注册表现生成 openapi.json，再推它 —— 不推 committed 那份（可能滞后，见文件头）
      - name: 🧬 生成 openapi 规范
        if: steps.guard.outputs.skip != 'true'
        run: pnpm openapi

      - name: 🦊 同步
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: |
          set +e
          node packages/core/scripts/sync-apifox.mjs 2>&1 | tee apifox-sync.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 🦊 Apifox 同步"
            echo ""
            echo '```'
            cat apifox-sync.log
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "同步失败 —— 规范没进 Apifox，检查 token 是否有效、是否有该项目权限。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

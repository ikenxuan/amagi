name: 📖 文档站部署（GitHub Pages）

# 这个工作流取代了从前的两条部署路径：
#   - `docs.yml`：TypeDoc 生成的 API 参考推到 `docs` 分支，由 Pages 的
#     「分支」模式发布
#   - Vercel / Netlify：Next.js 服务端形态的文档站
#
# 现在只留 GitHub Pages，且 Pages 的发布源改成 **GitHub Actions**（不是分支）——
# 站点是 `output: 'export'` 的静态产物，一份 artifact 发出去。
#
# 从前这里挂着两个站：`/` 是 fumadocs 文档站，`/types/` 是 TypeDoc 另建的 HTML 站
# （两套样式、两套搜索，站内搜索搜不到 API 参考）。2026-09-13 起 TypeDoc 只用来
# 抽 JSON，API 参考由 `scripts/generate-api-types.ts` 生成 MDX 与其它文档同一套
# 渲染，`/types/` 只剩 `post-export.mjs` 补的一个跳转页。
on:
  push:
    branches:
      - main
    paths:
      - 'packages/docs/**'
      - 'packages/core/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；排队中的旧提交直接取消（站点是全量的，中间态没意义）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          # `lastModified()` 插件读每个文件的 git 提交时间，浅克隆会让它退化成
          # 「克隆那一刻」（全站同一个日期）
          fetch-depth: 0

      # 文档站构建在这台 runner 上撞过 OOM：`exit code 143` = SIGTERM，
      # 内存被内核回收。公开仓库的 ubuntu-latest 是 4 vCPU / 16 GiB，
      # 而实测峰值贴着这个上限（`next-build` 主进程 11.87 GB，整机 15.76 GB）。
      #
      # 2026-09-17 首次部署又红了一次，症状不同：`The operation was canceled.`
      # —— swap 吃到 6.8/8 GB、可用内存只剩 224 MB，runner 被拖到失联，由外部
      # 掐掉而**不是**内核 OOM。同一份提交在 `release.yml` 里活了下来，所以那
      # 不是「哪一步真的坏了」，就是余量不够。缓冲加到 16 GB。
      - name: 💾 配置 swap（给构建留内存缓冲）
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          # 块大小自适应。8 GB 那一版实测只剩不到 1.5 GB 余量（可用内存一度掉到
          # 224 MB、swap 用掉 6.8/8 GB）—— 那已经不是缓冲，是掷硬币。上限同时看
          # 剩余磁盘：swapfile 之外还要留 6 GB 给 node_modules 与构建产物。
          FREE_MB=$(df -Pm / | awk 'NR==2 {print $4}')
          SWAP_MB=$(( FREE_MB - 6144 ))
          if [ "$SWAP_MB" -gt 16384 ]; then SWAP_MB=16384; fi
          if [ "$SWAP_MB" -lt 2048 ]; then
            echo "::warning::根分区只剩 ${FREE_MB}MB，swap 只能给到 2048MB —— 这点缓冲不够，构建有撞内存上限的风险"
            SWAP_MB=2048
          fi
          echo "根分区剩余 ${FREE_MB}MB → 建立 ${SWAP_MB}MB swap"
          sudo fallocate -l "${SWAP_MB}M" /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count="$SWAP_MB"
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        run: pnpm install

      # **一步产出完整站点**，本地与这里走的是同一条路 —— 从前的 TypeDoc 构建与
      # 合并只写在这个文件里，于是本地跑 `pnpm build:docs` 出来的产物没有 `/types/`，
      # 「本地验证通过」验的其实是另一份东西。
      #
      # `build:docs` 内部：build:core → docs 的 `docs:api`（从注册表生成 65 个 HTTP
      # 端点页 + 4 个 SDK 方法页 + 从 `packages/core/src/index.ts` 的导出面生成 8 个
      # 类型参考页）→ 三个自建校验（include 区段 / twoslash / 侧边栏）→ next build
      # （output: 'export'）→ post-export.mjs（跳转页 + `/docs/**.mdx` + 旧
      # `/types/` 兜底）→ 死链检查
      - name: 📚 构建站点
        shell: bash
        run: |
          set +e
          START=$(date +%s)

          # 内存探针，往 **stdout** 打：被 OOM 或失联杀掉时整台 runner 会一起没，
          # 写文件的采样随 VM 消失，只有已经流进日志的那些留得住。
          # 编译阶段的峰值贴着上限（used 15.7 GB + swap 6.8/8 GB、可用内存一度
          # 只剩 224 MB），所以这行不是装饰 —— 下次真红了，它是唯一能说明
          # 「爬到哪一步、被谁吃掉的」的证据。
          (
            while true; do
              echo "[mem] t=$(( $(date +%s) - START ))s $(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB", $3, $7}') $(free -m | awk '/^Swap:/{printf "swap=%sMB", $3}')"
              echo "[mem] top: $(ps -eo rss,comm --sort=-rss --no-headers | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')"
              sleep 10
            done
          ) &
          MEMPID=$!

          pnpm build:docs 2>&1 | tee docs-build.log
          RC=${PIPESTATUS[0]}
          kill $MEMPID 2>/dev/null
          ELAPSED=$(( $(date +%s) - START ))

          {
            echo "## 📚 文档站构建"
            echo ""
            echo "- 耗时：**${ELAPSED}s**（twoslash 全冷求值，无 .next 缓存）"
            echo "- 退出码：\`${RC}\`"
            echo ""
            echo '```'
            grep -E 'Compiled successfully|Generating static pages using|死链检查|个链接指向不存在的页面' docs-build.log | tail -n 4
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "构建失败。先看上面的 [mem] 行：可用内存掉到几百 MB 以内、swap 见底"
              echo "= 撞内存上限（把 swap 再调大；别去动 cpus，峰值在编译阶段，cpus 只管静态生成）；"
              echo "否则往后翻日志找真正的报错。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - name: ⚙️ 配置 Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/out

  deploy:
    name: 🚀 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

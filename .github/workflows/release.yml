name: CI/CD

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

      manual_version:
        description: '手动指定版本号 (如: 6.0.0，仅生产模式有效)'
        required: false
        type: string

      release_notes:
        description: '发布说明 (可选)'
        required: false
        type: string

      force_npm_publish:
        description: '强制发布到 NPM (仅生产模式)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

env:
  APP_NAME: amagi

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # 变更范围判定（阶段 9.5）：文档站变更只跑质量门禁，不跑发版链路。
  #
  # 从前是用触发器的 paths-ignore 把 packages/docs/** 整条流水线关掉 —— 代价是
  # 文档站的回归**永远进不了 CI**，「文档说的」与「包里有的」于是可以任意漂移
  # （阶段 9 的三个缺陷都是这么攒出来的）。现在触发器不再忽略 docs，改由这里判
  # 「这次是不是只改了文档站」：是 → unified-build 及其下游整条发版链路跳过，
  # quality 照跑（含文档站构建）；不是 → 一切照旧。
  changes:
    name: 🧭 变更范围
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🧭 判断是否只改了文档站
        id: scope
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         RANGE="${{ github.event.before }}..${{ github.sha }}" ;;
            *)            RANGE="" ;;
          esac

          FILES=$(git diff --name-only "$RANGE" 2>/dev/null || true)

          # 拿不到变更清单（workflow_dispatch、新分支推送的全 0 before、强推后
          # before 已不可达）按「含代码变更」处理：宁可多跑一次发版链路，
          # 也不能把代码变更误判成文档变更放过去。
          if [ -z "$FILES" ]; then
            DOCS_ONLY=false
            NOTE="拿不到变更清单（范围 \`${RANGE:-无}\`），按「含代码变更」处理"
          elif echo "$FILES" | grep -qvE '^packages/docs/'; then
            DOCS_ONLY=false
            NOTE="含 \`packages/docs/\` 之外的改动，走完整流水线"
          else
            DOCS_ONLY=true
            NOTE="只改了 \`packages/docs/\`，跳过发版链路（质量门禁仍会构建文档站）"
          fi

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          {
            echo "## 🧭 变更范围"
            echo ""
            echo "- 变更文件数：**$(echo "$FILES" | grep -c . || true)**"
            echo "- 仅文档站：\`$DOCS_ONLY\` —— $NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

  # 质量门禁：typecheck / lint / test / test:types / openapi:check / deps:check / types:size / build:docs
  # 这是 unified-build 的前置依赖，任一必需检查失败则整条流水线红。
  quality:
    name: 🔍 质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🔎 类型检查
        run: pnpm typecheck

      - name: 🧹 代码规范检查
        run: pnpm lint

      - name: ✅ 单元测试
        run: pnpm test

      # 阶段门 0 起必须：test:types（vitest --typecheck.enabled）无类型错误。
      # 测试文件的类型错误只有它能抓到（tsconfig 的 exclude 不检查 **/*.test.ts）。
      - name: 🧪 类型测试
        run: pnpm test:types

      # 阶段门 8：OpenAPI 规范是注册表的派生物，不许手写、不许忘了重跑生成器。
      # --check 把已提交的 openapi.json 与此刻从四个 registry 生成的内容逐字节比对。
      - name: 📐 OpenAPI 规范一致性
        shell: bash
        run: |
          set +e
          pnpm openapi:check 2>&1 | tee openapi-check.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 📐 OpenAPI 规范一致性"
            echo ""
            echo '```'
            tail -n 3 openapi-check.log
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "产物与注册表不一致 —— 跑 \`pnpm openapi\` 重新生成并提交（不要手改 openapi.json）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 阶段门 6：全仓 0 环达成，deps:check 转为必需检查。
      - name: 🔗 依赖环检查
        shell: bash
        run: |
          set +e
          pnpm deps:check 2>&1 | tee dpdm.log
          RC=${PIPESTATUS[0]}
          COUNT=$(awk '/• Circular Dependencies/,/• Warnings/' dpdm.log | grep -cE '^[[:space:]]+[0-9]+\)')
          {
            echo "## 🔗 依赖环检查"
            echo ""
            echo "- 当前 import 环数：**${COUNT}**（v7 目标 0）"
            echo "- \`pnpm deps:check\` 退出码：\`${RC}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 响应类型体积门禁。这道门是给**将来**准备的：`types/ReturnDataType/` 现在
      # 156 文件 / 27,130 行，编译产物已接近 790 KB，而响应类型自动化
      # （RESPONSE-TYPE-AUTOGEN-PRD）会让它很容易翻几倍 —— 全自动 + 多变体 + 判别
      # 联合，一次生成就能把 2.7 万行变成十万行，而且没人会察觉。基线即预算，
      # 涨必须是有意识的决定（改 BUDGET + 在提交信息里说清为什么）。
      - name: 📏 响应类型体积
        shell: bash
        run: |
          set +e
          pnpm types:size 2>&1 | tee type-size.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 📏 响应类型体积"
            echo ""
            echo '```'
            cat type-size.log
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "超预算了。**先确认这是不是意外膨胀**；确实该涨就改 \`packages/core/scripts/check-type-size.mts\` 里的 \`BUDGET\`，并在提交信息里写清为什么。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      # 阶段门 9：文档站进 CI，脱节即红。
      # twoslash 只在 `next dev` / `next build` 时求值 —— 在这一步落地之前，本仓 CI
      # 一次都没编译过文档示例，于是文档里的示例可以引用不存在的 API 而无人发现
      # （BUG-1「默认导入拿到 v6 门面」正是这样活了整个 v7 周期）。
      # `pnpm build:docs` 一步串起六件事：build:core → 从注册表生成 61 个 HTTP 端点页
      # → scripts/check-includes.mjs（`<include>` 区段还在不在，秒级）
      # → scripts/check-twoslash.mjs（123 个 twoslash 块逐个真编译，约 10s）
      # → next build（求值全站 twoslash + 渲染）→ scripts/check-links.mjs（死链）。
      # 两个轻检查都放在 next build **之前**：坏示例十几秒就红，不用等几分钟。
      #
      # 这两条也挂在 `pnpm typecheck` 上（上面那一步），于是「区段被改名」与
      # 「示例编译不过」在本 job 里各有两处会红。这不是冗余：整站构建是最容易被
      # 环境挡住的一步（实测 Turbopack 起不了子进程、next/font 取不到 Google Fonts
      # 都能让它在 20s 内失败），而这两件事不该被那一步绑住 —— twoslash 只要有
      # TypeScript 就能跑，不需要 Next 的 bundler。
      #
      # 不缓存 .next：Next 的构建缓存按 MDX 与配置的内容哈希命中，**不**看
      # packages/core 的 .d.ts —— 一旦缓存，「核心改了导致示例编译不过」正好会被
      # 缓存掩盖，而那是本阶段最要防的失效模式。宁可每次冷编译。
      - name: 📚 文档站构建（twoslash 求值 + 死链检查）
        shell: bash
        run: |
          set +e
          START=$(date +%s)
          pnpm build:docs 2>&1 | tee docs-build.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))
          {
            echo "## 📚 文档站构建"
            echo ""
            echo "- 耗时：**${ELAPSED}s**（含 twoslash 求值，无 .next 缓存）"
            echo "- \`pnpm build:docs\` 退出码：\`${RC}\`"
            echo ""
            echo '```'
            grep -E '死链检查|内部 /docs|个链接指向不存在的页面' docs-build.log | tail -n 5
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "文档站构建失败 —— 要么某个 twoslash 代码块编译不过（示例与实现脱节），"
              echo "要么站内出现死链。两者都是必需检查，不许绕过：改示例或改实现，别删 twoslash。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  version-release:
    runs-on: ubuntu-latest
    needs: [unified-build]
    if: |
      needs.unified-build.outputs.build_success == 'true' &&
      github.event_name != 'pull_request'
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created || steps.manual-release.outputs.releases_created }}
      core_release_created: ${{ steps.release-please.outputs['packages/core--release_created'] || steps.manual-release.outputs.core_release_created }}
      core_tag_name: ${{ steps.release-please.outputs['packages/core--tag_name'] || steps.manual-release.outputs.core_tag_name }}
      core_version: ${{ steps.get-version-info.outputs.core_version }}
      should_upload_release: ${{ steps.get-version-info.outputs.should_upload_release }}
      release_tag_name: ${{ steps.get-version-info.outputs.release_tag_name }}
      is_manual_production: ${{ steps.get-version-info.outputs.is_manual_production }}
      manual_release_notes: ${{ steps.get-version-info.outputs.manual_release_notes }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🚀 执行版本发布检查
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: 🎯 处理手动生产发布
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        id: manual-release
        run: |
          if [ -z "${{ inputs.manual_version }}" ]; then
            echo "❌ 生产模式必须指定版本号" >&2
            exit 1
          fi

          if ! echo "${{ inputs.manual_version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z]+\.[0-9]+)?$'; then
            echo "❌ 版本号格式错误，应为 x.y.z 或 x.y.z-prerelease.n 格式" >&2
            exit 1
          fi

          echo "releases_created=true" >> $GITHUB_OUTPUT
          echo "core_release_created=true" >> $GITHUB_OUTPUT
          echo "core_tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT

          echo "✅ 手动生产发布已配置：v${{ inputs.manual_version }}"

      - name: 🏷️ 获取版本信息
        id: get-version-info
        run: |
          cd packages/core

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "production" ]; then
            npm version ${{ inputs.manual_version }} --no-git-tag-version
            CORE_VERSION="${{ inputs.manual_version }}"
            echo "should_upload_release=true" >> $GITHUB_OUTPUT
            echo "release_tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT
            echo "is_manual_production=true" >> $GITHUB_OUTPUT
            echo "manual_release_notes=${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "🎯 手动生产模式：版本 $CORE_VERSION"
          else
            CORE_VERSION=$(node -p "require('./package.json').version")
            echo "is_manual_production=false" >> $GITHUB_OUTPUT
            echo "manual_release_notes=" >> $GITHUB_OUTPUT
            
            if [ "${{ steps.release-please.outputs.core_release_created }}" = "true" ] || [ "${{ inputs.force_npm_publish }}" = "true" ]; then
              echo "should_upload_release=true" >> $GITHUB_OUTPUT
              echo "release_tag_name=${{ steps.release-please.outputs.core_tag_name }}" >> $GITHUB_OUTPUT
            else
              echo "should_upload_release=false" >> $GITHUB_OUTPUT
              echo "release_tag_name=" >> $GITHUB_OUTPUT
            fi
          fi

          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 当前版本：$CORE_VERSION"

  unified-build:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # 只改文档站时不打包、不发预览包（下游 job 都靠 build_success 串起来，
    # 这里跳过即整条发版链路跳过）。
    if: needs.changes.outputs.docs_only != 'true'
    outputs:
      build_success: ${{ steps.build-status.outputs.success }}
      package_name: ${{ steps.package-info.outputs.name }}
      package_short_name: ${{ steps.package-info.outputs.short_name }}
      commit_hash: ${{ steps.git-info.outputs.commit_hash }}
      short_commit_hash: ${{ steps.git-info.outputs.short_commit_hash }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🔨 执行完整项目构建
        run: |
          echo "开始构建所有包..."
          pnpm build:core
          if [ $? -ne 0 ]; then
            echo "❌ 构建失败，退出工作流"
            exit 1
          fi
          echo "✅ 构建成功"

      - name: 🏷️ 获取包信息
        id: package-info
        working-directory: packages/core
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_SHORT_NAME=$(basename "$PACKAGE_NAME")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_name=$PACKAGE_SHORT_NAME" >> $GITHUB_OUTPUT

      - name: 📊 获取 Git 信息
        id: git-info
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "short_commit_hash=$SHORT_COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: 🎯 应用手动版本号（仅生产模式）
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        run: |
          cd packages/core
          npm version ${{ inputs.manual_version }} --no-git-tag-version
          echo "✅ 已应用手动版本号：${{ inputs.manual_version }}"

      - name: 📦 准备发布产物 (正式版)
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/production/
          cp -r package.json README.md CHANGELOG.md LICENSE dist ${{ runner.temp }}/production/
          node -e "const fs=require('fs');const path='${{ runner.temp }}/production/package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));delete pkg.devDependencies;delete pkg.scripts;fs.writeFileSync(path,JSON.stringify(pkg,null,2));"

      - name: 📦 准备预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/preview/
          cp -r package.json README.md CHANGELOG.md LICENSE dist ${{ runner.temp }}/preview/

      - name: 📤 上传正式版构建产物
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: ${{ runner.temp }}/production/
          if-no-files-found: error

      - name: 📤 上传预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: ${{ runner.temp }}/preview/
          if-no-files-found: error

      - name: ✅ 标记构建状态
        id: build-status
        run: echo "success=true" >> $GITHUB_OUTPUT

  npm-production-publish:
    runs-on: ubuntu-latest
    needs: [version-release, unified-build]
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.core_release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/core

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: ⏫ 升级 npm 版本
        run: npm install -g npm@11.12.1

      - name: 🚀 发布到 NPM 官方源
        id: publish-to-npm
        working-directory: packages/core
        run: |
          pnpm publish --no-git-checks --provenance

          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 NPM 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "- **包名:** \`${{ steps.publish-to-npm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ steps.publish-to-npm.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **模式:** ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production' && '🎯 手动生产发布' || '🤖 自动发布' }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.version-release.outputs.manual_release_notes }}" != "" ]; then
            echo "- **发布说明:** ${{ needs.version-release.outputs.manual_release_notes }}" >> $GITHUB_STEP_SUMMARY
          fi

  github-package-publish:
    runs-on: ubuntu-latest
    needs: [version-release, unified-build]
    permissions:
      contents: read
      packages: write
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.core_release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/core

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'

      - name: ✏️ 修改包名 (添加 Scope)
        working-directory: packages/core
        run: |
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          if [[ "$ORIGINAL_NAME" != @* ]]; then
            NEW_NAME="@$OWNER/$ORIGINAL_NAME"
          else
            NEW_NAME="$ORIGINAL_NAME"
          fi

          echo "📦 修改包名: $ORIGINAL_NAME -> $NEW_NAME"

          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.name = '$NEW_NAME';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: 🚀 发布到 GitHub Packages
        working-directory: packages/core
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 GitHub Packages 发布成功" >> $GITHUB_STEP_SUMMARY
          PKG_NAME=$(node -p "require('./packages/core/package.json').name")
          VERSION=$(node -p "require('./packages/core/package.json').version")

          echo "- **包名:** \`$PKG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY

  preview-package-publish:
    runs-on: ubuntu-latest
    needs: [unified-build]
    permissions:
      pull-requests: write
    if: needs.unified-build.outputs.build_success == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production')
    outputs:
      pkg_version: ${{ steps.version-gen.outputs.version }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: packages/core

      - name: 🏷️ 生成符合SemVer的预览版本号
        id: version-gen
        working-directory: packages/core
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          BASE_CLEAN=$(echo "$PKG_VERSION" | sed 's/-.*$//')
          MAJOR=$(echo "$BASE_CLEAN" | cut -d. -f1)
          MINOR=$(echo "$BASE_CLEAN" | cut -d. -f2)
          PATCH=$(echo "$BASE_CLEAN" | cut -d. -f3)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          elif [ "${{ github.event_name }}" = "push" ]; then
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          else
            COMMIT_RANGE="HEAD~20..HEAD"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -Eqi 'BREAKING CHANGE|^[[:space:]]*[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eqi '^[[:space:]]*feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TIMESTAMP=$(TZ='Asia/Shanghai' date +%Y%m%d%H%M%S)
          COMMIT_SHORT=${{ needs.unified-build.outputs.short_commit_hash }}

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NEW_VERSION="${BASE_NEXT}-alpha.${{ github.event.number }}.${TIMESTAMP}.${COMMIT_SHORT}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NEW_VERSION="${BASE_NEXT}-beta.${TIMESTAMP}.${COMMIT_SHORT}"
          else
            NEW_VERSION="${BASE_NEXT}-dev.${TIMESTAMP}.${COMMIT_SHORT}"
          fi

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 发布预览包
        id: publish_pkg
        working-directory: packages/core
        env:
          PKG_PR_NEW_COMMENT_ARGS: ${{ github.event_name == 'pull_request' && '--comment=update --commentWithSha' || '--comment=off' }}
        run: |
          npx --yes pkg-pr-new publish --json output.json --compact --packageManager=pnpm $PKG_PR_NEW_COMMENT_ARGS > pkg-output.txt

  pr-summary:
    runs-on: ubuntu-latest
    needs: [unified-build, preview-package-publish]
    if: needs.unified-build.outputs.build_success == 'true'
    steps:
      - name: 📊 生成PR构建摘要
        run: |
          echo "# 🚀 PR 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 预览版本: \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`pnpm add ${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY

  main-push-summary:
    runs-on: ubuntu-latest
    needs: [unified-build, preview-package-publish]
    if: needs.unified-build.outputs.build_success == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📊 生成main分支推送摘要
        run: |
          echo "# 🚀 Main 分支构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 预览版本: \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`pnpm add ${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY

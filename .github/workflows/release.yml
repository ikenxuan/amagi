name: CI/CD

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

      manual_version:
        description: '手动指定版本号 (如: 6.0.0，仅生产模式有效)'
        required: false
        type: string

      release_notes:
        description: '发布说明 (可选)'
        required: false
        type: string

      force_npm_publish:
        description: '强制发布到 NPM (仅生产模式)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

env:
  APP_NAME: amagi

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # 变更范围判定（阶段 9.5）：**不发版的包**变更只跑质量门禁，不跑发版链路。
  #
  # 从前是用触发器的 paths-ignore 把 packages/docs/** 整条流水线关掉 —— 代价是
  # 文档站的回归**永远进不了 CI**，「文档说的」与「包里有的」于是可以任意漂移
  # （阶段 9 的三个缺陷都是这么攒出来的）。现在触发器不再忽略它们，改由这里判
  # 「这次改的是不是全都在不发版的包里」：是 → unified-build 及其下游整条发版链路跳过，
  # quality 照跑（含文档站与控制台的构建）；不是 → 一切照旧。
  #
  # 范围是 `packages/docs/` 与 `packages/web/`：两个都 `private: true`，
  # `.release-please-config.json` 只登记了 `packages/core`。所以只改它们时走一遍
  # 打包 + 发预览包是纯浪费 —— 而 output 名字仍叫 `docs_only` 是为了不动下游那个
  # `if:`（改名要同步改 430 行那处，收益是零）。
  changes:
    name: 🧭 变更范围
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🧭 判断这次改的是不是全在不发版的包里
        id: scope
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         RANGE="${{ github.event.before }}..${{ github.sha }}" ;;
            *)            RANGE="" ;;
          esac

          FILES=$(git diff --name-only "$RANGE" 2>/dev/null || true)

          # 拿不到变更清单（workflow_dispatch、新分支推送的全 0 before、强推后
          # before 已不可达）按「含代码变更」处理：宁可多跑一次发版链路，
          # 也不能把代码变更误判成文档变更放过去。
          if [ -z "$FILES" ]; then
            DOCS_ONLY=false
            NOTE="拿不到变更清单（范围 \`${RANGE:-无}\`），按「含代码变更」处理"
          elif echo "$FILES" | grep -qvE '^packages/(docs|web)/'; then
            DOCS_ONLY=false
            NOTE="含可发版包的改动，走完整流水线"
          else
            DOCS_ONLY=true
            NOTE="只改了 \`packages/docs/\` 与 \`packages/web/\`（都不发版），跳过发版链路；质量门禁仍全跑"
          fi

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          {
            echo "## 🧭 变更范围"
            echo ""
            echo "- 变更文件数：**$(echo "$FILES" | grep -c . || true)**"
            echo "- 仅不发版的包：\`$DOCS_ONLY\` —— $NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

  # 质量门禁：typecheck / lint / test / test:types / openapi:check / deps:check / types:check
  #          / types:size / build:docs / web build
  # 这是 unified-build 的前置依赖，任一必需检查失败则整条流水线红。
  quality:
    name: 🔍 质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🔎 类型检查
        run: pnpm typecheck

      - name: 🧹 代码规范检查
        run: pnpm lint

      - name: ✅ 单元测试
        run: pnpm test

      # 阶段门 0 起必须：test:types（vitest --typecheck.enabled）无类型错误。
      # 测试文件的类型错误只有它能抓到（tsconfig 的 exclude 不检查 **/*.test.ts）。
      - name: 🧪 类型测试
        run: pnpm test:types

      # 阶段门 8：OpenAPI 规范是注册表的派生物，不许手写、不许忘了重跑生成器。
      # --check 把已提交的 openapi.json 与此刻从四个 registry 生成的内容逐字节比对。
      - name: 📐 OpenAPI 规范一致性
        shell: bash
        run: |
          set +e
          pnpm openapi:check 2>&1 | tee openapi-check.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 📐 OpenAPI 规范一致性"
            echo ""
            echo '```'
            tail -n 3 openapi-check.log
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "产物与注册表不一致 —— 跑 \`pnpm openapi\` 重新生成并提交（不要手改 openapi.json）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 阶段门 6：全仓 0 环达成，deps:check 转为必需检查。
      - name: 🔗 依赖环检查
        shell: bash
        run: |
          set +e
          pnpm deps:check 2>&1 | tee dpdm.log
          RC=${PIPESTATUS[0]}
          COUNT=$(awk '/• Circular Dependencies/,/• Warnings/' dpdm.log | grep -cE '^[[:space:]]+[0-9]+\)')
          {
            echo "## 🔗 依赖环检查"
            echo ""
            echo "- 当前 import 环数：**${COUNT}**（v7 目标 0）"
            echo "- \`pnpm deps:check\` 退出码：\`${RC}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 生成的响应类型与它的证据（本地 corpus 样本）一致性。
      #
      # **CI 里这一步验不了一致性，而且这是设计使然。** 响应样本是运行时内容、不进 git
      # （见 .gitignore 的 corpus 段），所以 CI 上根本没有可比的证据 —— 这时脚本明说
      # 「跳过比对」并保持退出码 0，不假装通过。真正的比对发生在**本地有样本的机器上**。
      #
      # 那它还留着干什么：它验的是**落盘那一层自己跑得通** —— `pnpm types:check` 端到端跑一遍
      # （读已提交的产物树、算破坏性变更、走完脚本），坏了就红。
      # **别把它当成产物树自检**：那三样（读不了的样本、产物路径撞车、残留文件）全都要有样本才碰得到，
      # 而残留文件检测在 `gen-types.mts` 的 `else if (check)` 分支里 —— 零样本时走的是它前面那条
      # 短路，CI 上永远到不了。所以 CI 上这一步实际是个冒烟测试；一致性与残留那半只在本地有样本时能验。
      - name: 🧬 响应类型产物自检
        shell: bash
        run: |
          set +e
          pnpm types:check 2>&1 | tee types-check.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 🧬 响应类型产物自检"
            echo ""
            echo '```'
            tail -n 5 types-check.log
            echo '```'
            echo ""
            echo "样本不进 git，所以 CI 验不了「产物与证据一致」—— 那一步在本地跑 \`pnpm types:check\`。"
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "产物树自检失败 —— 跑 \`pnpm gen:types\` 重新生成并提交（不要手改 \`packages/response-types/src/generated/\`）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 响应类型体积门禁，**量两棵树**：手写的（core，160 文件 / 26,258 行，编译产物已 806 KB）
      # 与生成的（response-types，28 文件 / 2,475 行）。数字由 `pnpm types:size` 量，别在这里手抄。
      # 两棵树的门禁性质不一样：手写树是**棘轮**（只该不变或变小，被生成产物逐个替换掉，
      # 而且树变小之后预算要跟着往回拧 —— 漏了这一步余量就会悄悄变大）；
      # 生成树预期会随端点覆盖增长（12/61），所以总量是松上限、**单文件才是真门** ——
      # 「一次生成炸出十万行」这类事故先在单文件上现形（快手 emojiList 的 iconUrls
      # 没收成索引签名时，一个端点就产出 665 行、占当批产物 64%）。
      - name: 📏 响应类型体积
        shell: bash
        run: |
          set +e
          pnpm types:size 2>&1 | tee type-size.log
          RC=${PIPESTATUS[0]}
          {
            echo "## 📏 响应类型体积"
            echo ""
            echo '```'
            cat type-size.log
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "超预算了。**先确认这是不是意外膨胀**；确实该涨就改 \`packages/core/scripts/check-type-size.mts\` 里的 \`BUDGETS\`，并在提交信息里写清为什么。"
              echo ""
              echo "生成树的**单文件**超了先别调预算 —— 那通常是生成器该收的形状没收（映射表没收成索引签名、结构等价没复用），调预算会把真问题盖住。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      # 阶段门 9：文档站进 CI，脱节即红。
      # twoslash 只在 `next dev` / `next build` 时求值 —— 在这一步落地之前，本仓 CI
      # 一次都没编译过文档示例，于是文档里的示例可以引用不存在的 API 而无人发现
      # （BUG-1「默认导入拿到 v6 门面」正是这样活了整个 v7 周期）。
      # `pnpm build:docs` 一步串起六件事：build:core → 从注册表生成 61 个 HTTP 端点页
      # → scripts/check-includes.mjs（`<include>` 区段还在不在，秒级）
      # → scripts/check-twoslash.mjs（123 个 twoslash 块逐个真编译，约 10s）
      # → next build（求值全站 twoslash + 渲染）→ scripts/check-links.mjs（死链）。
      # 两个轻检查都放在 next build **之前**：坏示例十几秒就红，不用等几分钟。
      #
      # 这两条也挂在 `pnpm typecheck` 上（上面那一步），于是「区段被改名」与
      # 「示例编译不过」在本 job 里各有两处会红。这不是冗余：整站构建是最容易被
      # 环境挡住的一步（实测 Turbopack 起不了子进程、next/font 取不到 Google Fonts
      # 都能让它在 20s 内失败），而这两件事不该被那一步绑住 —— twoslash 只要有
      # TypeScript 就能跑，不需要 Next 的 bundler。
      #
      # 不缓存 .next：Next 的构建缓存按 MDX 与配置的内容哈希命中，**不**看
      # packages/core 的 .d.ts —— 一旦缓存，「核心改了导致示例编译不过」正好会被
      # 缓存掩盖，而那是本阶段最要防的失效模式。宁可每次冷编译。
      - name: 📚 文档站构建（twoslash 求值 + 死链检查）
        shell: bash
        run: |
          set +e
          START=$(date +%s)
          pnpm build:docs 2>&1 | tee docs-build.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))
          {
            echo "## 📚 文档站构建"
            echo ""
            echo "- 耗时：**${ELAPSED}s**（含 twoslash 求值，无 .next 缓存）"
            echo "- \`pnpm build:docs\` 退出码：\`${RC}\`"
            echo ""
            echo '```'
            grep -E '死链检查|内部 /docs|个链接指向不存在的页面' docs-build.log | tail -n 5
            echo '```'
            if [ "$RC" -ne 0 ]; then
              echo ""
              echo "文档站构建失败 —— 要么某个 twoslash 代码块编译不过（示例与实现脱节），"
              echo "要么站内出现死链。两者都是必需检查，不许绕过：改示例或改实现，别删 twoslash。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # 控制台前端构建。**`tsc --noEmit` 抓不到这一类** —— 缺 `index.html`、Tailwind 插件
      # 没配、CSS 里 `@import` 的包解析不开、动态 import 的路径拼错，全都要真跑一次
      # bundler 才现形。而这个包的两份 tsconfig 都是 `noEmit`，所以上面那步类型检查
      # 一个都碰不到。
      #
      # 另外还验一件类型检查永远验不了的事：**Node-only 的东西有没有漏进浏览器包**。
      # core 是 Node-only（axios / express / protobufjs / node:crypto），前端只准
      # `import type` 它；写成值 import 时 tsc 照样绿（类型是对的），但产物里会多出
      # 一整条 Node 依赖、在浏览器里第一行就炸。
      #
      # **判据是产物体积，不是 grep 关键字。** 实测过：故意值 import 一个平台注册表，
      # 产物从 465 KB 涨到 852 KB，而 `axios` / `makeClientCtx` / `bilibiliRegistry`
      # 这些名字在 minify 之后**一个都搜不到**（标识符被改名了）——
      # 按名字搜会给出一个几乎恒绿的假门禁。体积翻倍藏不住。
      # （那次实测跑在界面重做前的 465 KB 基线上，所以别拿 465 当今天的值 —— 重点是**倍数**。
      #  当前基线写在下面那两个预算旁边的注释里，且始终由命令量。）
      # `protobuf` 那类字符串常量确实还搜得到，所以保留一小组作为补充信号。
      #
      # **体积这一步现在是两个预算而不是一个**：入口（首屏真的会下载的那一组文件）管首屏体验、
      # 是棘轮；总量（全部 chunk 加总）管泄漏、是天花板。为什么必须分开，见下面
      # `ENTRY` / `BYTES` 上面那段 —— 一句话：拆 chunk 救不了一个「把两件事拴在一起」的数字。
      - name: 🖥️ 控制台前端构建（含 Node-only 泄漏检查）
        shell: bash
        run: |
          set +e
          pnpm --filter @ikenxuan/amagi-web run build 2>&1 | tee web-build.log
          RC=${PIPESTATUS[0]}
          LEAKS=""
          BYTES=0
          ENTRY=0
          if [ "$RC" -eq 0 ]; then
            # **两个预算，因为先前那一个同时担着两件互相打架的事。**
            #
            # 老判据只有 `cat dist/assets/*.js | wc -c` 一个数字，于是「接一个新组件」与
            # 「漏进一整条 Node 依赖」撞的是同一条线 —— 而这两件事该有完全不同的松紧：
            # 前者是日常、要一条拧得紧的棘轮盯着首屏；后者是事故、只要有个天花板拦住就行。
            # 合成一个的后果实测过：撞线时唯一的出路是抬上限（那等于把泄漏那道闸一起放松），
            # 而**拆 chunk 根本救不了它** —— 懒加载出来的 chunk 照样落在 `dist/assets/` 里，
            # 总量基本不变甚至因为 chunk 边界的样板略增（这一轮实测 753,228 → 763,570，+10,342）。
            #
            # ① **入口预算**：真正对应「用户首屏下载多少」，也是唯一值得往紧拧的那个。
            # 判据不是 `index-*.js` 一个文件 —— 那会漏掉入口静态 import 进来的共享 chunk
            # （今天是 `alert` 134 KB、`api` 49 KB、`Dialog` 38 KB 这几个：`Dialog` 由
            # `EndpointJumper` 拖着，而它刻意是 eager 的，`⌘K` 随时可能被按）。
            # 所以量的是 `dist/index.html` 里**入口脚本 + 它那串 modulepreload**，
            # 也就是浏览器在首屏之前真的会去取的那一组文件。这条判据顺带把
            # 「有人把懒加载的组件改回静态 import」也接住了：那个 chunk 会进 preload 名单，
            # 这个数字当场跳上来（`table` 一个就是 104 KB）。懒加载边界另有一条测试钉着
            # （`packages/web/test/lazy.test.ts`）—— 两条判据方向不同：那条读源码，这条量产物。
            #
            # **这两个预算各自接住什么，实测过一次**（故意把 `RequestTable` 改回静态 import）：
            #   入口 613,776 → 739,227（+125,451，连带把 `table` 拖进首屏）——> 入口预算红。
            #   总量 763,570 → 763,190（**反而少了 380**，因为少了一个 chunk 边界的样板）。
            # 也就是说这种回退**老那个单一总量判据一个字都不会说** —— 那正是拆成两个的理由，
            # 而不只是「分得更清楚」。反过来，泄漏那种事总量涨几百 KB，入口不一定动
            # （泄漏可能落在某个懒加载 chunk 里），所以两条谁也替不了谁。
            #
            # ② **总量上限**：保留，但**刻意留松**。它的真正作用是拦 Node 依赖泄漏
            # （见上面那段：漏进一个平台注册表，产物从 465 KB 到 852 KB），
            # 而那个作用只需要有个天花板，不需要卡得紧 —— 卡紧了只会让日常增长来撞它，
            # 撞了又只能抬，抬完泄漏那道闸也一起松了。真正精确的泄漏判据是下面那组字符串探针。
            #
            # **两个数字都由命令量，别在这里手抄**：
            #   pnpm --filter @ikenxuan/amagi-web build
            #   # 入口（就是下面那条 ENTRY 判据本身）：
            #   grep -oE '(src|href)="/assets/[^"]*\.js"' packages/web/dist/index.html \
            #     | sed 's|.*"/assets/|packages/web/dist/assets/|;s|"$||' | sort -u | xargs cat | wc -c
            #   cat packages/web/dist/assets/*.js | wc -c    # 总量
            #   ls -l packages/web/dist/assets/              # 看清有几个 chunk、各多大
            #
            # 入口上限 640 KB（655,360）：实测 613,776，用掉 93.7%、余量 41,584 字节。
            # 总量上限 840 KB（860,160）：实测 763,570，用掉 88.8%、余量 96,590 字节。
            # 走势（入口）：466 KB（界面重做前）→ 566,774 → 604,382 → 753,228（`Table` +
            # `ComparePanel` 进来，那一轮把老的单一上限撑破了 87,628）→ **613,776**
            # （这一轮把四块改成 `React.lazy`：`RequestTable` / `ComparePanel` / `GeneratedPanel`
            #  / `CookieDrawer`，连带把它们共用的 `table` 104 KB 一起挪出首屏，−139,452 / −18.5%）。
            #
            # 撞**入口**预算时**先别抬它**：这仓库的体积预算是棘轮，只往紧拧不往松放
            # （见 `chore(ci): 体积棘轮跟着往回拧`）。顺序是先排除泄漏，再看能不能把新东西
            # 改成懒加载（现在有 `React.lazy` 那条现成的路了，`src/App.tsx` 顶上那段有先例），
            # 抬上限是最后一招、且要在提交信息里写清为什么。
            ENTRY=$(grep -oE '(src|href)="/assets/[^"]*\.js"' packages/web/dist/index.html 2>/dev/null \
              | sed 's|.*"/assets/|packages/web/dist/assets/|;s|"$||' | sort -u | xargs -r cat 2>/dev/null | wc -c)
            BYTES=$(cat packages/web/dist/assets/*.js 2>/dev/null | wc -c)
            # **量不出来要当失败**，不能静默放行 —— 0 字节会顺利通过「小于上限」那一问，
            # 而它真正的意思是判据自己坏了（改了产物目录、改了 base、index.html 没产出）
            if [ "$ENTRY" -eq 0 ]; then
              LEAKS="量不出首屏集合：packages/web/dist/index.html 里找不到 /assets/*.js"
            elif [ "$ENTRY" -gt 655360 ]; then
              LEAKS="首屏 ${ENTRY} 字节，超过 640 KB 入口预算"
            fi
            if [ "$BYTES" -gt 860160 ]; then
              LEAKS="${LEAKS} 产物合计 ${BYTES} 字节，超过 840 KB 总量上限"
            fi
            # **shiki 只在 server 侧，没有漏进浏览器包** —— PRD ③ 节整条论证靠这一条，
            # 而它的判据不是 grep 'shiki'：产物里 `shiki` 恒有 7 处命中，全落在 CodeBlock.tsx
            # 那段约 250 字节的 CSS 字面量里（`.shiki code` / `--shiki-light` 这类选择器名），
            # 按 'shiki' 搜只会得到一个恒红的假判据。要验的是**引擎**有没有进来，探这一组名字：
            #   grep -coE 'createHighlighter|getHighlighter|oniguruma|textmate|github-dark|shikijs' packages/web/dist/assets/*.js
            # 实测六个全 0 命中（高亮在 `packages/web/server/highlight.ts` 里跑，前端只收 HTML）。
            # 将来有人想「顺手把 shiki 挪进前端」，这组探针就是现成的复验方法 —— 任一非 0
            # 就是引擎进了浏览器包，而那时体积这条会先红：`from 'shiki'` 那个全量入口打进
            # 浏览器约 10 MB（自带全部语法与主题），是这两条上限的十几倍。
            # 字符串常量还留在产物里的那几个，作为补充信号（minify 不改字符串字面量）。
            # `AMAGI_COOKIE` 不搜 —— 界面上有一句「设环境变量 AMAGI_COOKIE_<平台>」的
            # 提示文案，那是字面量不是泄漏
            for needle in protobufjs 'node:crypto' 'node:fs' 'node:buffer'; do
              if grep -qF "$needle" packages/web/dist/assets/*.js 2>/dev/null; then
                LEAKS="${LEAKS} ${needle}"
              fi
            done
            if [ -n "$LEAKS" ]; then RC=1; fi
          fi
          {
            echo "## 🖥️ 控制台前端构建"
            echo ""
            echo '```'
            tail -n 6 web-build.log
            echo '```'
            echo ""
            # 两个数字分开报，因为它们该被分开读：入口那个是首屏体验、要往紧拧；
            # 总量那个是泄漏的天花板、刻意留松。合报一个数就是老判据那个毛病
            echo "- 首屏 JS（入口 + modulepreload）：**${ENTRY}** 字节（入口预算 655,360 / 640 KB，上一轮实测 613,776 —— 用掉 93.7%）"
            echo "- JS 产物合计（含懒加载的 chunk）：**${BYTES}** 字节（总量上限 860,160 / 840 KB，上一轮实测 763,570 —— 用掉 88.8%）"
            if [ -n "$LEAKS" ]; then
              echo ""
              echo "**超预算，或 Node-only 代码可能漏进了浏览器包**：\`${LEAKS}\`"
              echo ""
              echo "前端只准 \`import type\` core 与 typegen —— 写成值 import 时 \`tsc\` 照样绿，"
              echo "但产物会带上一整条 Node 依赖、在浏览器里第一行就炸。"
              echo "共享的类型放 \`packages/web/shared/contract.ts\`（那个文件一个 import 都没有）。"
              echo ""
              echo "**先看红的是哪一条 —— 两条的意思完全不同：**"
              echo ""
              echo "- **总量**红了：优先怀疑泄漏（一整条 Node 依赖是几百 KB 量级）。先排除它，再谈别的。"
              echo "- **入口**红了：多半是有东西进了首屏。看是不是把懒加载的组件改回了静态 import"
              echo "  （\`src/App.tsx\` 顶上那四个 \`lazy()\` —— \`table\` 一个就 104 KB），"
              echo "  或者新接的组件本该懒加载。**先别顺手抬入口预算** —— 它在这仓库是棘轮，只往紧拧不往松放；"
              echo "  现在有 \`React.lazy\` 那条现成的路，抬上限是最后一招，且要在提交信息里写清为什么。"
            elif [ "$RC" -ne 0 ]; then
              echo ""
              echo "\`vite build\` 失败。这一类 \`tsc --noEmit\` 抓不到：缺 \`index.html\`、"
              echo "Tailwind 插件没配、CSS 里 \`@import\` 的包解析不开、动态 import 路径拼错。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  version-release:
    runs-on: ubuntu-latest
    needs: [unified-build]
    if: |
      needs.unified-build.outputs.build_success == 'true' &&
      github.event_name != 'pull_request'
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created || steps.manual-release.outputs.releases_created }}
      core_release_created: ${{ steps.release-please.outputs['packages/core--release_created'] || steps.manual-release.outputs.core_release_created }}
      core_tag_name: ${{ steps.release-please.outputs['packages/core--tag_name'] || steps.manual-release.outputs.core_tag_name }}
      core_version: ${{ steps.get-version-info.outputs.core_version }}
      should_upload_release: ${{ steps.get-version-info.outputs.should_upload_release }}
      release_tag_name: ${{ steps.get-version-info.outputs.release_tag_name }}
      is_manual_production: ${{ steps.get-version-info.outputs.is_manual_production }}
      manual_release_notes: ${{ steps.get-version-info.outputs.manual_release_notes }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🚀 执行版本发布检查
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: 🎯 处理手动生产发布
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        id: manual-release
        run: |
          if [ -z "${{ inputs.manual_version }}" ]; then
            echo "❌ 生产模式必须指定版本号" >&2
            exit 1
          fi

          if ! echo "${{ inputs.manual_version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z]+\.[0-9]+)?$'; then
            echo "❌ 版本号格式错误，应为 x.y.z 或 x.y.z-prerelease.n 格式" >&2
            exit 1
          fi

          echo "releases_created=true" >> $GITHUB_OUTPUT
          echo "core_release_created=true" >> $GITHUB_OUTPUT
          echo "core_tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT

          echo "✅ 手动生产发布已配置：v${{ inputs.manual_version }}"

      - name: 🏷️ 获取版本信息
        id: get-version-info
        run: |
          cd packages/core

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "production" ]; then
            npm version ${{ inputs.manual_version }} --no-git-tag-version
            CORE_VERSION="${{ inputs.manual_version }}"
            echo "should_upload_release=true" >> $GITHUB_OUTPUT
            echo "release_tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT
            echo "is_manual_production=true" >> $GITHUB_OUTPUT
            echo "manual_release_notes=${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "🎯 手动生产模式：版本 $CORE_VERSION"
          else
            CORE_VERSION=$(node -p "require('./package.json').version")
            echo "is_manual_production=false" >> $GITHUB_OUTPUT
            echo "manual_release_notes=" >> $GITHUB_OUTPUT
            
            if [ "${{ steps.release-please.outputs.core_release_created }}" = "true" ] || [ "${{ inputs.force_npm_publish }}" = "true" ]; then
              echo "should_upload_release=true" >> $GITHUB_OUTPUT
              echo "release_tag_name=${{ steps.release-please.outputs.core_tag_name }}" >> $GITHUB_OUTPUT
            else
              echo "should_upload_release=false" >> $GITHUB_OUTPUT
              echo "release_tag_name=" >> $GITHUB_OUTPUT
            fi
          fi

          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 当前版本：$CORE_VERSION"

  unified-build:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # 只改文档站时不打包、不发预览包（下游 job 都靠 build_success 串起来，
    # 这里跳过即整条发版链路跳过）。
    if: needs.changes.outputs.docs_only != 'true'
    outputs:
      build_success: ${{ steps.build-status.outputs.success }}
      package_name: ${{ steps.package-info.outputs.name }}
      package_short_name: ${{ steps.package-info.outputs.short_name }}
      commit_hash: ${{ steps.git-info.outputs.commit_hash }}
      short_commit_hash: ${{ steps.git-info.outputs.short_commit_hash }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🔨 执行完整项目构建
        run: |
          echo "开始构建所有包..."
          pnpm build:core
          if [ $? -ne 0 ]; then
            echo "❌ 构建失败，退出工作流"
            exit 1
          fi
          echo "✅ 构建成功"

      - name: 🏷️ 获取包信息
        id: package-info
        working-directory: packages/core
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_SHORT_NAME=$(basename "$PACKAGE_NAME")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_name=$PACKAGE_SHORT_NAME" >> $GITHUB_OUTPUT

      - name: 📊 获取 Git 信息
        id: git-info
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "short_commit_hash=$SHORT_COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: 🎯 应用手动版本号（仅生产模式）
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        run: |
          cd packages/core
          npm version ${{ inputs.manual_version }} --no-git-tag-version
          echo "✅ 已应用手动版本号：${{ inputs.manual_version }}"

      - name: 📦 准备发布产物 (正式版)
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/production/
          cp -r package.json README.md CHANGELOG.md LICENSE dist ${{ runner.temp }}/production/
          node -e "const fs=require('fs');const path='${{ runner.temp }}/production/package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));delete pkg.devDependencies;delete pkg.scripts;fs.writeFileSync(path,JSON.stringify(pkg,null,2));"

      - name: 📦 准备预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/preview/
          cp -r package.json README.md CHANGELOG.md LICENSE dist ${{ runner.temp }}/preview/

      - name: 📤 上传正式版构建产物
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: ${{ runner.temp }}/production/
          if-no-files-found: error

      - name: 📤 上传预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: ${{ runner.temp }}/preview/
          if-no-files-found: error

      - name: ✅ 标记构建状态
        id: build-status
        run: echo "success=true" >> $GITHUB_OUTPUT

  npm-production-publish:
    runs-on: ubuntu-latest
    needs: [version-release, unified-build]
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.core_release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/core

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: ⏫ 升级 npm 版本
        run: npm install -g npm@11.12.1

      - name: 🚀 发布到 NPM 官方源
        id: publish-to-npm
        working-directory: packages/core
        run: |
          pnpm publish --no-git-checks --provenance

          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 NPM 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "- **包名:** \`${{ steps.publish-to-npm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ steps.publish-to-npm.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **模式:** ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production' && '🎯 手动生产发布' || '🤖 自动发布' }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.version-release.outputs.manual_release_notes }}" != "" ]; then
            echo "- **发布说明:** ${{ needs.version-release.outputs.manual_release_notes }}" >> $GITHUB_STEP_SUMMARY
          fi

  github-package-publish:
    runs-on: ubuntu-latest
    needs: [version-release, unified-build]
    permissions:
      contents: read
      packages: write
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.core_release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/core

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'

      - name: ✏️ 修改包名 (添加 Scope)
        working-directory: packages/core
        run: |
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          if [[ "$ORIGINAL_NAME" != @* ]]; then
            NEW_NAME="@$OWNER/$ORIGINAL_NAME"
          else
            NEW_NAME="$ORIGINAL_NAME"
          fi

          echo "📦 修改包名: $ORIGINAL_NAME -> $NEW_NAME"

          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.name = '$NEW_NAME';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: 🚀 发布到 GitHub Packages
        working-directory: packages/core
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 GitHub Packages 发布成功" >> $GITHUB_STEP_SUMMARY
          PKG_NAME=$(node -p "require('./packages/core/package.json').name")
          VERSION=$(node -p "require('./packages/core/package.json').version")

          echo "- **包名:** \`$PKG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY

  preview-package-publish:
    runs-on: ubuntu-latest
    needs: [unified-build]
    permissions:
      pull-requests: write
    if: needs.unified-build.outputs.build_success == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production')
    outputs:
      pkg_version: ${{ steps.version-gen.outputs.version }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: packages/core

      - name: 🏷️ 生成符合SemVer的预览版本号
        id: version-gen
        working-directory: packages/core
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          BASE_CLEAN=$(echo "$PKG_VERSION" | sed 's/-.*$//')
          MAJOR=$(echo "$BASE_CLEAN" | cut -d. -f1)
          MINOR=$(echo "$BASE_CLEAN" | cut -d. -f2)
          PATCH=$(echo "$BASE_CLEAN" | cut -d. -f3)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          elif [ "${{ github.event_name }}" = "push" ]; then
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          else
            COMMIT_RANGE="HEAD~20..HEAD"
            COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -Eqi 'BREAKING CHANGE|^[[:space:]]*[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eqi '^[[:space:]]*feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TIMESTAMP=$(TZ='Asia/Shanghai' date +%Y%m%d%H%M%S)
          COMMIT_SHORT=${{ needs.unified-build.outputs.short_commit_hash }}

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NEW_VERSION="${BASE_NEXT}-alpha.${{ github.event.number }}.${TIMESTAMP}.${COMMIT_SHORT}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NEW_VERSION="${BASE_NEXT}-beta.${TIMESTAMP}.${COMMIT_SHORT}"
          else
            NEW_VERSION="${BASE_NEXT}-dev.${TIMESTAMP}.${COMMIT_SHORT}"
          fi

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 发布预览包
        id: publish_pkg
        working-directory: packages/core
        env:
          PKG_PR_NEW_COMMENT_ARGS: ${{ github.event_name == 'pull_request' && '--comment=update --commentWithSha' || '--comment=off' }}
        run: |
          npx --yes pkg-pr-new publish --json output.json --compact --packageManager=pnpm $PKG_PR_NEW_COMMENT_ARGS > pkg-output.txt

  pr-summary:
    runs-on: ubuntu-latest
    needs: [unified-build, preview-package-publish]
    if: needs.unified-build.outputs.build_success == 'true'
    steps:
      - name: 📊 生成PR构建摘要
        run: |
          echo "# 🚀 PR 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 预览版本: \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`pnpm add ${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY

  main-push-summary:
    runs-on: ubuntu-latest
    needs: [unified-build, preview-package-publish]
    if: needs.unified-build.outputs.build_success == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📊 生成main分支推送摘要
        run: |
          echo "# 🚀 Main 分支构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- 预览版本: \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 安装: \`pnpm add ${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY

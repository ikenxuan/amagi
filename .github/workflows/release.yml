name: Release

# ──────────────────────────────────────────────────────────────────────────
# **tag 就是发布按钮。** 本 workflow 的唯一触发器是 `v*` tag 推送。
#
# 发版流程（rolldown/tsdown 风格，2026-09-21 从 release-please 模式改造）：
#   1. 维护者本地跑 `pnpm run release`（`scripts/release.ts`，bumpp 交互式）：
#      bump `packages/core` 版本 → `chore: release vX.Y.Z` 提交 → 打 tag → push。
#   2. tag push 触发本 workflow，依次：版本闸 → changelogithub 建 GitHub Release
#      → build → npm 发布 → GitHub Packages 镜像。
#
# 为什么换掉 release-please：
#   ① 它开的 release PR 由 GITHUB_TOKEN 创建，GitHub 的递归保护让 PR 上的 CI
#      永远不跑 —— 门禁形同虚设，只能盲点合并；
#   ② 同一版本并存两个 release PR 时，第二次合并在建 Release 那步炸
#      `already_exists, field: tag_name`（v7.0.0-beta.2 实测）；
#   ③ 它生成的 CHANGELOG.md 风格与 oxfmt 互不相让，每发一版 format:check 必红。
#   tag 触发没有这些问题：tag 是人推的、不经过 PR；本 workflow 也不跑 lint/test
#   门禁 —— 那些归 ci.yml 管，代码合并进 main 前就验过了，发布永远不被 CI 拦住。
#
# npm 认证是 OIDC trusted publishing（仓库里不存 NPM_TOKEN）：
#   需要先在 npmjs.com 的包设置里配置 trusted publisher —— 绑定 GitHub 仓库
#   `ikenxuan/amagi` + **workflow 文件名 `release.yml`**（npm 按文件名匹配；
#   本文件一旦改名，必须去 npm 端同步改，否则发布 404）。
#   同时要求 npm CLI ≥ 11.5.1，Node 24 自带的未必够新，下面有显式升级那一步。
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # changelogithub 建 GitHub Release
  id-token: write # npm OIDC trusted publishing
  packages: write # GitHub Packages 镜像

env:
  APP_NAME: amagi

jobs:
  npm-publish:
    name: 🚀 发布到 npm
    runs-on: ubuntu-latest
    # 连推两个 tag（或失败重跑与下一次发版挨得近）时串行：后到的 run 靠幂等
    # 检查跳过，而不是两个 publish 撞 E403。
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # changelogithub 要完整提交历史来算 changelog

      # 防「先打 tag 后 bump」：tag 是脚本推的，一旦与 package.json 脱节，
      # 发出去的包版本和 GitHub Release 就各说各话。不一致直接红 —— 此时
      # 什么都还没发，删掉 tag 重来即可。
      - name: 🛡️ 版本闸：tag 必须等于 packages/core 的版本
        id: gate
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "❌ tag $GITHUB_REF_NAME 与 packages/core/package.json 的版本 v$VERSION 不一致" >&2
            echo "   先 bump 再打 tag —— \`pnpm run release\` 就是干这个的" >&2
            exit 1
          fi
          echo "✅ tag 与版本一致：$GITHUB_REF_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # registry-url 会让 setup-node 在 .npmrc 里留下 `_authToken=${NODE_AUTH_TOKEN}`；
      # OIDC 模式下刻意不设这个 env —— npm ≥11.5.1 在 id-token: write 的 run 里
      # 会改走 trusted publishing，拿 OIDC token 换临时凭据。
      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Node 24 自带的 npm 不一定 ≥ 11.5.1（OIDC trusted publishing 的最低版本），
      # 显式升级，别赌 runner 镜像里那个够新。
      - name: ⏫ 升级 npm（OIDC 需要 ≥ 11.5.1）
        run: npm install -g npm@11.12.1

      - name: 📦 安装依赖
        run: pnpm install

      # changelog 失败不阻断发布（continue-on-error）：GitHub Release 是给人看的，
      # npm 包才是产物 —— token 权限问题、API 抖动不该把发版拦在半路，
      # 失败了回头手工补一份 Release 即可。所以它排在 build 之前、publish 之前。
      - name: 📝 生成 GitHub Release（changelogithub）
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🔨 构建
        run: pnpm build:core

      # 幂等检查：版本已在 npm 上就跳过，重跑 tag 不会撞 E403。
      # 公开的 npm view 不需要凭据（`.npmrc` 里那条空 token 不影响读公共包）。
      - name: 🔎 检查该版本是否已在 npm 上
        id: check-published
        working-directory: packages/core
        run: |
          VERSION=${{ steps.gate.outputs.version }}
          PKG=$(node -p "require('./package.json').name")

          if OUTPUT=$(npm view "$PKG@$VERSION" version 2>&1); then
            echo "⏭️ $PKG@$VERSION 已在 npm 上，跳过发布（重跑场景）"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUTPUT" | grep -q 'E404'; then
            echo "🚀 $PKG@$VERSION 尚未发布"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            # registry 读不通（网络/鉴权）时**不能**当成「没发过」—— 那会拿一次
            # 注定失败的 publish 去撞，把真实原因埋在噪音里。直接红。
            echo "❌ 无法确认 npm 上的版本状态：" >&2
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi

      - name: 🚀 发布到 npm（OIDC trusted publishing）
        if: steps.check-published.outputs.published == 'true'
        working-directory: packages/core
        run: |
          VERSION=${{ steps.gate.outputs.version }}

          # **预发布版本必须显式给 dist-tag。** `pnpm publish` 的默认标签是 `latest`，
          # 而它不像 npm 那样拒绝预发布版本 —— 不拦的后果是
          # `pnpm add @ikenxuan/amagi` 装到 beta。
          # 标签取后缀的第一段：7.0.0-beta.3 → beta，7.0.0-rc.1 → rc。
          TAG_ARG=""
          case "$VERSION" in
            *-*) TAG_ARG="--tag $(printf '%s' "${VERSION#*-}" | cut -d. -f1)" ;;
          esac
          echo "🏷️ dist-tag：${TAG_ARG:-latest（正式版）}"

          # --provenance 与 OIDC 是一对：出处声明直接用这次 OIDC 换的身份签。
          # --no-git-checks：tag 与工作区的绑定已由上面的版本闸验过。
          pnpm publish --provenance --no-git-checks $TAG_ARG

      # 产物同时喂给下游的 GitHub Packages 镜像 job —— 与 npm 发出去的是同一份
      # 构建，不在那个 job 里再 build 一次。
      - name: 📦 准备发布产物
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/production/
          cp -r package.json README.md CHANGELOG.md LICENSE dist ${{ runner.temp }}/production/
          node -e "const fs=require('fs');const path='${{ runner.temp }}/production/package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));delete pkg.devDependencies;delete pkg.scripts;fs.writeFileSync(path,JSON.stringify(pkg,null,2));"

      - name: 📤 上传发布产物
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: ${{ runner.temp }}/production/
          if-no-files-found: error

      - name: 📊 发布报告
        run: |
          {
            echo "## 📦 npm 发布"
            echo ""
            echo "- **版本:** \`${{ steps.gate.outputs.version }}\`"
            echo "- **已发布:** \`${{ steps.check-published.outputs.published }}\`（false = 版本已在 npm 上，幂等跳过）"
          } >> "$GITHUB_STEP_SUMMARY"

  # 与 npm 那环串行（needs）：npm 是闸门，它没发出去镜像也不发 —— 版本来源只有一个。
  # 反过来 GPR 失败不影响 npm 已经发出去的版本；它是镜像，失败后重跑本 workflow
  # 幂等续上，而不是撞 E409 红在那里。
  github-package-publish:
    name: 🪞 GitHub Packages 镜像
    runs-on: ubuntu-latest
    needs: [npm-publish]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/core

      # 沿用 Node 20 + GITHUB_TOKEN 那套：GPR 不需要 OIDC，也不需要新 npm。
      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'

      - name: ✏️ 修改包名 (添加 Scope)
        working-directory: packages/core
        run: |
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          if [[ "$ORIGINAL_NAME" != @* ]]; then
            NEW_NAME="@$OWNER/$ORIGINAL_NAME"
          else
            NEW_NAME="$ORIGINAL_NAME"
          fi

          echo "📦 修改包名: $ORIGINAL_NAME -> $NEW_NAME"

          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.name = '$NEW_NAME';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # 包名在上一步已经改成 @owner/... 且带上 publishConfig.registry，
      # 所以这里的 `npm view` 查的就是 GitHub Packages 那个源。
      - name: 🔎 检查该版本是否已在 GitHub Packages 上
        id: check-published
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./package.json').name")

          if OUTPUT=$(npm view "$PKG@$VERSION" version 2>&1); then
            echo "⏭️ $PKG@$VERSION 已在 GitHub Packages 上，跳过发布"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUTPUT" | grep -q 'E404'; then
            echo "🚀 $PKG@$VERSION 尚未发布，开始发布"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 无法确认 GitHub Packages 上的版本状态：" >&2
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 发布到 GitHub Packages
        if: steps.check-published.outputs.published == 'true'
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # `npm publish` 对预发布版本**直接报错**，不给 `--tag` 就整步红。
          # 标签口径与上面 npm 官方源那步一致。
          TAG_ARG=""
          case "$VERSION" in
            *-*) TAG_ARG="--tag $(printf '%s' "${VERSION#*-}" | cut -d. -f1)" ;;
          esac

          npm publish $TAG_ARG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 生成发布报告
        if: steps.check-published.outputs.published == 'true'
        run: |
          echo "## 📦 GitHub Packages 发布成功" >> $GITHUB_STEP_SUMMARY
          PKG_NAME=$(node -p "require('./packages/core/package.json').name")
          VERSION=$(node -p "require('./packages/core/package.json').version")

          echo "- **包名:** \`$PKG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
